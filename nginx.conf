# CANIVA frontend - Nginx (serves the Vite production build)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend ceiling is 7 MB per request (6 MB file) -
    # leave headroom for multipart overhead.
    client_max_body_size 20m;

    # Hashed build assets - safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API -> Spring Boot container (compose service name).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React Router: any unmatched path serves index.html so
    # client-side routes (/stories/1, /ngo/animals, ...) work
    # on refresh or deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
